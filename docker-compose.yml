services:

  ollama:
    image: ollama/ollama:latest
    container_name: mipizarra-ollama
    mem_limit: ${OLLAMA_MEM_LIMIT:-4g}
    restart: "no"
    ports:
      # Solo en el propio equipo: la API llega a Ollama por la red de Docker (http://ollama:11434) y Ollama
      # no tiene autenticación, así que no se publica en la LAN. Para depurar desde otra máquina, túnel SSH.
      - "127.0.0.1:11434:11434"
    volumes:
      - ./ollama:/root/.ollama
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    build: ./api
    container_name: mipizarra-api
    mem_limit: ${API_MEM_LIMIT:-768m}
    restart: "no"
    ports:
      # Por defecto solo en el propio equipo (la API no tiene usuarios: el secreto es la única barrera).
      # En un servidor, pon BIND_IP=<ip de la LAN> en .env y MIPIZARRA_INTERNAL_SECRET (ver SEGURIDAD.md).
      - "${BIND_IP:-127.0.0.1}:8090:8090"
    volumes:
      # Solo lo que la API necesita: los PDF de terceros (data/pdfs) NO se montan, el sistema no puede verlos.
      - ./data/exercises.json:/app/data/exercises.json:ro
      - ./data/teoria:/app/data/teoria:ro
      - ./data/reglamento:/app/data/reglamento:ro
      - ./data/chroma_db:/app/data/chroma_db
      - ./data/sessions:/app/data/sessions
      - ./api:/app
      - ./tools:/app/tools
      - ./experimental:/app/experimental
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:4b-instruct}
      - OLLAMA_MODEL_SESION=${OLLAMA_MODEL_SESION:-qwen3:4b-instruct}
      - OLLAMA_MODEL_REGLAMENTO=${OLLAMA_MODEL_REGLAMENTO:-${OLLAMA_MODEL_SESION:-qwen3:4b-instruct}}
      - EMBED_MODEL=${EMBED_MODEL:-embeddinggemma:latest}
      - EXERCISES_PATH=/app/data/exercises.json
      - CHROMA_DB_DIR=/app/data/chroma_db
      # Si se setea, la API exige header X-Internal-Secret en cada request.
      # NPM lo añade en la config Advanced del proxy host (ver SEGURIDAD.md).
      - INTERNAL_SECRET=${MIPIZARRA_INTERNAL_SECRET:-}
    depends_on:
      - ollama

  frontend:
    build: ./frontend
    container_name: mipizarra-frontend
    mem_limit: ${FRONTEND_MEM_LIMIT:-128m}
    restart: "no"
    ports:
      - "${BIND_IP:-127.0.0.1}:8501:8000"
    environment:
      - API_URL=http://mipizarra-api:8090
      # Vacío = el frontend genera una clave aleatoria una vez y la guarda junto a la base de datos (volumen /data).
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost 127.0.0.1} ${BIND_IP:-127.0.0.1}
      # El frontend llama a la API dentro de la misma red Docker; debe enviar el secret.
      - INTERNAL_SECRET=${MIPIZARRA_INTERNAL_SECRET:-}
      # Cuentas (jugadas guardadas): base de datos SQLite en el volumen de abajo. Con HTTPS delante, DJANGO_COOKIE_SECURE=True.
      - DJANGO_DB_PATH=/data/db.sqlite3
      - DJANGO_COOKIE_SECURE=${DJANGO_COOKIE_SECURE:-False}
      - DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS:-}
    volumes:
      - ./data/frontend:/data
    depends_on:
      - api

  # Experimental: no forma parte del flujo actual (ver experimental/README.md)
  finetune:
    build:
      context: ./experimental/docker/finetune
      dockerfile: Dockerfile
    container_name: mipizarra-finetune
    profiles: ["training"]
    user: "0:0"                # root para evitar problemas de permisos
    volumes:
      - ./:/workspace
      - ./cache:/workspace/.cache   # caché de HuggingFace escribible
    working_dir: /workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ["bash"]

networks:
  default:
    name: mipizarra-net
